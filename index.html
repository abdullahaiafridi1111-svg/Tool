<!doctype html>
<html lang="en">
  <head>
    <script>
      (function() {
        function isViteWsError(err) {
          if (!err) return false;
          var str = typeof err === 'string' ? err : (err.message || err.reason || String(err));
          return str.indexOf('WebSocket') !== -1 || str.indexOf('vite') !== -1 || str.indexOf('websocket') !== -1;
        }
        window.addEventListener('unhandledrejection', function(e) {
          if (isViteWsError(e.reason)) {
            e.stopImmediatePropagation();
            e.preventDefault();
          }
        }, true);
        window.addEventListener('error', function(e) {
          if (isViteWsError(e.error) || isViteWsError(e.message)) {
            e.stopImmediatePropagation();
            e.preventDefault();
          }
        }, true);
        var origConsoleError = console.error;
        console.error = function() {
          for (var i = 0; i < arguments.length; i++) {
            if (isViteWsError(arguments[i])) return;
          }
          return origConsoleError.apply(console, arguments);
        };
        var origConsoleWarn = console.warn;
        console.warn = function() {
          for (var i = 0; i < arguments.length; i++) {
            if (isViteWsError(arguments[i])) return;
          }
          return origConsoleWarn.apply(console, arguments);
        };
      })();
    </script>

    </script>
